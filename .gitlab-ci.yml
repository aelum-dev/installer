# GitLab CI/CD pipeline for the Aelum Installer.
#
# Mirrors the previous GitHub Actions workflow (now removed) so the same
# gates run on every push/merge request:
#   - backend : go mod tidy check, gofmt, frontend build, golangci-lint, go vet, go test -race
#   - frontend: svelte-check (typecheck) + vitest
#   - security: gitleaks (secret scan)
#
# Runs on every branch. Scope it down (e.g. rules: only main) if you prefer.

stages:
  - build
  - test
  - security

variables:
  NODE_VERSION: "22"

# ── backend: Go + frontend build gates ────────────────────────────────────────
backend:
  stage: build
  # Pin to 1.25.0: golangci-lint v2.12 bundles honnef.co/go/tools v0.7.0, which
  # declares `go 1.25.0`. Its staticcheck IR builder panics on the rewritten
  # stdlib `internal/poll` present in Go 1.26+/1.27, so we stay on the exact
  # stdlib it was built against.
  image: golang:1.25.0-bookworm
  cache:
    key:
      files:
        - go.sum
    paths:
      - "$HOME/go/pkg/mod/"
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends curl ca-certificates build-essential gnupg
    # Node.js 22 (needed for the frontend build step) via NodeSource.
    - curl -fsSL https://deb.nodesource.com/setup_${NODE_VERSION}.x | bash -
    - apt-get install -y --no-install-recommends nodejs
    # golangci-lint v2 (matches the previous workflow's pinned version).
    # Installed via `go install` rather than the official install.sh, whose
    # embedded checksum verification is flaky and fails on some releases.
    - go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.0
  script:
    # Fail if go.mod/go.sum drift from go.sum.
    - go mod tidy && git diff --exit-code
    # Fail if any Go file is not gofmt-formatted (the old workflow applied gofmt
    # silently; this one fails the build instead).
    - test -z "$(gofmt -l .)" || { gofmt -l .; echo "Go code is not gofmt-formatted"; exit 1; }
    # Frontend must build (Wails embeds it into the binary).
    - cd frontend && npm install && npm run build && cd ..
    # Lint, then test with the race detector (needs cgo → build-essential above).
    - golangci-lint run ./...
    - go vet ./...
    - go test -race ./...

# ── frontend: typecheck + unit tests ──────────────────────────────────────────
frontend:
  stage: test
  image: node:${NODE_VERSION}-bookworm
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - frontend/node_modules/
  before_script:
    # Install deps so the job works even when the cache is cold (first push).
    - cd frontend && npm install && cd ..
  script:
    # frontend/src/lib/constants.ts is committed to the repo, so the typecheck
    # and tests use the versioned file. This is a Node-only image (no Go), and
    # constants are regenerated locally by build.sh before committing.
    - cd frontend && npm run check && npm run test

# ── security: secret scanning ─────────────────────────────────────────────────
# gitleaks no longer publishes a Docker image (gitleaks/gitleaks was removed
# from Docker Hub), so install the binary instead. Pinned to v8.30.1; bump the
# version and the asset name together on upgrade.
security:
  stage: security
  image: debian:bookworm-slim
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends curl ca-certificates tar git
    - curl -fsSL -o /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
    - tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
  script:
    - gitleaks detect --source . --redact --exit-code=1
