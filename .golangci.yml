version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - revive
    - unconvert
    - durationcheck
    - makezero
    - copyloopvar
  settings:
    revive:
      rules:
        - name: dot-imports
          disabled: true
        - name: argument-limit
          disabled: true
        - name: cyclomatic
          arguments: [35]
        - name: function-length
          arguments: [120, 200]
        - name: line-length-limit
          arguments: [240]
        - name: exported
          disabled: true
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - govet
      - path: main\.go
        linters:
          - typecheck
      - text: "InstallContext"
        linters:
          - revive
      - text: "InstallDesktop"
        linters:
          - revive

formatters:
  enable:
    - goimports
  settings:
    goimports:
      local-prefixes:
        - aestheticos-installer

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
