version: "2"

run:
  tests: true

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - revive
    - unconvert
    - durationcheck
    - makezero
    - copyloopvar
  settings:
    revive:
      rules:
        - name: dot-imports
          disabled: true
        - name: argument-limit
          disabled: true
        - name: cyclomatic
          arguments: [35]
        - name: function-length
          arguments: [120, 200]
        - name: line-length-limit
          arguments: [240]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes: aestheticos-installer

linters.exclusions:
  rules:
    - path: _test\.go
      linters:
        - errcheck
        - govet
    - source: "InstallContext"
      linters:
        - revive
    - source: "InstallDesktop"
      linters:
        - revive

issues:
  show-stats: true
