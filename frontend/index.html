<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>aelum-installer</title>
    <!-- Apply the persisted theme (dark by default) before first paint so the
         installer never flashes the wrong scheme. A classic inline script runs
         during parsing, before the deferred module (main.ts) below. -->
    <script type="text/javascript">
      (function () {
        var ROOT = document.documentElement;
        var KEY = 'aelum-theme';
        var theme;
        try {
          theme = window.localStorage.getItem(KEY);
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = 'dark';
        }
        ROOT.setAttribute('data-theme', theme);
      })();
    </script>
</head>
<body>
<div id="app"></div>
<script src="./src/main.ts" type="module"></script>
</body>
</html>
