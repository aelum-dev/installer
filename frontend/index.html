<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>aelum-installer</title>
    <!-- Apply the persisted theme (dark by default) before first paint so the
         installer never flashes the wrong scheme. A classic inline script runs
         during parsing, before the deferred module (main.ts) below. -->
    <script type="text/javascript">
      (function () {
        var ROOT = document.documentElement;
        var KEY = 'aelum-theme';
        var theme;
        try {
          theme = window.localStorage.getItem(KEY);
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = 'dark';
        }
        ROOT.setAttribute('data-theme', theme);
      })();
    </script>
    <!-- The app stylesheet is an external file, so the first frame has no
         background rule yet and WebKitGTK paints its default white canvas —
         that is the light flash on startup. Paint the theme background inline
         so the first frame is already correct. Keep these colours in sync with
         --md-sys-color-surface in src/style.css. -->
    <style type="text/css">
      html {
        background-color: #141218;
        color-scheme: dark;
      }
      html[data-theme="light"] {
        background-color: #fff7f9;
        color-scheme: light;
      }
    </style>
</head>
<body>
<div id="app"></div>
<script src="./src/main.ts" type="module"></script>
</body>
</html>
